name: build

on: [push, pull_request]

jobs:
  ubuntu:
    if: ${{ github.ref != 'refs/heads/pr-1544-observer-effect' }}
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64, aarch64, riscv64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: sudo apt-get update
      - run: sudo apt-get install makeself printer-driver-cups-pdf
      - run: ant -Dtarget.arch=${{ matrix.arch }} makeself
      - uses: actions/upload-artifact@v7
        with:
          name: qz-tray-linux-${{ matrix.arch }}
          path: out/qz-tray-*.run
      - if: ${{ matrix.arch == 'x86_64' }}
        run: |
          # Only run tests on same arch
          sudo apt-get install firefox chromium
          ant -Dqz.test.htmlVectorHeight.repetitions=1 testng
          # Run policy tests again, but as root
          sudo JAVA_HOME="$JAVA_HOME" JAVACMD="$JAVA_HOME/bin/java" ant -Dtestng.pattern="**/policy/**" testng
          sudo DEBUG=true out/qz-tray-*.run
          /opt/qz-tray/qz-tray --version
          sudo apt-get install nsis
          ant nsis

  macos:
    if: ${{ github.ref != 'refs/heads/pr-1544-observer-effect' }}
    runs-on: [macos-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: ant -Dtarget.arch=${{ matrix.arch }} pkgbuild
      - uses: actions/upload-artifact@v7
        with:
          name: qz-tray-macos-${{ matrix.arch }}
          path: out/qz-tray-*.pkg
      - if: ${{ matrix.arch == 'aarch64' }}
        run: |
          # Only run tests on same arch
          brew install --cask google-chrome firefox rwts-pdfwriter
          ant -Dqz.test.htmlVectorHeight.repetitions=1 testng
          # Run policy tests again, but as root
          sudo ant -Dtestng.pattern="**/policy/**" testng
          sudo installer -pkg out/qz-tray-*.pkg -target / || (cat /tmp/qz-install.log && false)
          "/Applications/QZ Tray.app/Contents/MacOS/QZ Tray" --version
          brew install nsis makeself
          ant makeself
          ant nsis

  windows:
    runs-on: [windows-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: choco install nsis
      - run: ant "-Dtarget.arch=${{ matrix.arch }}" nsis
      - uses: actions/upload-artifact@v7
        with:
          name: qz-tray-windows-${{ matrix.arch }}
          path: out/qz-tray-*.exe
      - name: Install test browsers
        if: ${{ matrix.arch == 'x86_64' }}
        run: choco install firefox
      - name: Run tests on same architecture
        if: ${{ matrix.arch == 'x86_64' }}
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=1" testng
      - name: Probe body scroll width
        id: body_scroll_width
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=body-scroll-width" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Probe body offset width
        id: body_offset_width
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=body-offset-width" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Probe body client width
        id: body_client_width
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=body-client-width" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Probe document client width
        id: html_client_width
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=html-client-width" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Probe body bounding width
        id: body_rect_width
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=body-rect-width" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Probe computed body width
        id: computed_body_width
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=computed-body-width" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Summarize reduced probes
        if: ${{ always() && matrix.arch == 'x86_64' }}
        run: |
          @"
          body scroll width: ${{ steps.body_scroll_width.outcome }}
          body offset width: ${{ steps.body_offset_width.outcome }}
          body client width: ${{ steps.body_client_width.outcome }}
          document client width: ${{ steps.html_client_width.outcome }}
          body bounding width: ${{ steps.body_rect_width.outcome }}
          computed body width: ${{ steps.computed_body_width.outcome }}
          "@ >> $env:GITHUB_STEP_SUMMARY

          $outcomes = @(
              "${{ steps.body_scroll_width.outcome }}",
              "${{ steps.body_offset_width.outcome }}",
              "${{ steps.body_client_width.outcome }}",
              "${{ steps.html_client_width.outcome }}",
              "${{ steps.body_rect_width.outcome }}",
              "${{ steps.computed_body_width.outcome }}"
          )
          if ($outcomes -notcontains "success") {
              throw "No single layout read stabilized 1,000 focused cases"
          }
      - name: Verify installed application
        if: ${{ matrix.arch == 'x86_64' }}
        run: |
          Start-Process -Wait ./out/qz-tray-*.exe -ArgumentList "/S"
          "&'C:/Program Files/QZ Tray/qz-tray.exe' --wait --version|Out-Null"
