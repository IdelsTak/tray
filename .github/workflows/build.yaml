name: build

on: [push, pull_request]

jobs:
  ubuntu:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64, aarch64, riscv64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: sudo apt-get update
      - run: sudo apt-get install makeself printer-driver-cups-pdf
      - run: ant -Dtarget.arch=${{ matrix.arch }} makeself
      - uses: actions/upload-artifact@v7
        with:
          name: qz-tray-linux-${{ matrix.arch }}
          path: out/qz-tray-*.run
      - if: ${{ matrix.arch == 'x86_64' }}
        run: |
          # Only run tests on same arch
          sudo apt-get install firefox chromium
          ant -Dqz.test.htmlVectorHeight.repetitions=1 testng
          # Run policy tests again, but as root
          sudo JAVA_HOME="$JAVA_HOME" JAVACMD="$JAVA_HOME/bin/java" ant -Dtestng.pattern="**/policy/**" testng
          sudo DEBUG=true out/qz-tray-*.run
          /opt/qz-tray/qz-tray --version
          sudo apt-get install nsis
          ant nsis

  macos:
    runs-on: [macos-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: ant -Dtarget.arch=${{ matrix.arch }} pkgbuild
      - uses: actions/upload-artifact@v7
        with:
          name: qz-tray-macos-${{ matrix.arch }}
          path: out/qz-tray-*.pkg
      - if: ${{ matrix.arch == 'aarch64' }}
        run: |
          # Only run tests on same arch
          brew install --cask google-chrome firefox rwts-pdfwriter
          ant -Dqz.test.htmlVectorHeight.repetitions=1 testng
          # Run policy tests again, but as root
          sudo ant -Dtestng.pattern="**/policy/**" testng
          sudo installer -pkg out/qz-tray-*.pkg -target / || (cat /tmp/qz-install.log && false)
          "/Applications/QZ Tray.app/Contents/MacOS/QZ Tray" --version
          brew install nsis makeself
          ant makeself
          ant nsis

  windows:
    runs-on: [windows-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: choco install nsis
      - run: ant "-Dtarget.arch=${{ matrix.arch }}" nsis
      - uses: actions/upload-artifact@v7
        with:
          name: qz-tray-windows-${{ matrix.arch }}
          path: out/qz-tray-*.exe
      - name: Install test browsers
        if: ${{ matrix.arch == 'x86_64' }}
        run: choco install firefox googlechrome
      - name: Run tests on same architecture
        if: ${{ matrix.arch == 'x86_64' }}
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=1" testng
      - name: Reproduce observer baseline
        id: observer_none
        if: ${{ matrix.arch == 'x86_64' }}
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=none" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Probe JavaScript boundary
        id: observer_noop
        if: ${{ matrix.arch == 'x86_64' && steps.observer_none.outcome == 'failure' }}
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=noop" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Probe DOM metric reads
        id: observer_metrics
        if: ${{ matrix.arch == 'x86_64' && steps.observer_none.outcome == 'failure' }}
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=metrics" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Probe JSON stringification
        id: observer_stringify
        if: ${{ matrix.arch == 'x86_64' && steps.observer_none.outcome == 'failure' }}
        continue-on-error: true
        run: ant "-Dqz.test.htmlVectorHeight.repetitions=500" "-Dqz.html.vector.observer=stringify" "-Dtestng.pattern=**/HtmlVectorHeightTests.class" unit-tests
      - name: Summarize observer probes
        if: ${{ always() && matrix.arch == 'x86_64' }}
        run: |
          @"
          baseline: ${{ steps.observer_none.outcome }}
          noop: ${{ steps.observer_noop.outcome }}
          metrics: ${{ steps.observer_metrics.outcome }}
          stringify: ${{ steps.observer_stringify.outcome }}
          "@ >> $env:GITHUB_STEP_SUMMARY

          if ("${{ steps.observer_none.outcome }}" -ne "failure") {
              throw "Baseline did not reproduce within 1,000 focused cases"
          }
      - name: Verify installed application
        if: ${{ matrix.arch == 'x86_64' }}
        run: |
          Start-Process -Wait ./out/qz-tray-*.exe -ArgumentList "/S"
          "&'C:/Program Files/QZ Tray/qz-tray.exe' --wait --version|Out-Null"
